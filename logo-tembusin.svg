<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="tembusinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="tembusinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1E3A8A" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Shape -->
  <rect width="48" height="48" rx="14" fill="url(#tembusinGrad)" filter="url(#tembusinShadow)"/>
  <!-- Target Breakthrough Dynamic 'T' with Upward Chevron (Menembus Seleksi) -->
  <path d="M13 15 H35 M24 15 V33" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Upward Arrowhead piercing through -->
  <path d="M18 24 L24 18 L30 24" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Target notch checkmark -->
  <path d="M29 29 L32 32 L37 26" stroke="#34D399" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
